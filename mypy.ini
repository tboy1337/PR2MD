[mypy]
# Python version
python_version = 3.12

# Strict type checking flags (per user rules)
disallow_any_generics = True
disallow_any_unimported = True
no_implicit_reexport = True
warn_return_any = True

# Additional strict flags
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True

# Strictness flags
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
warn_no_return = True
warn_unreachable = True
strict_optional = True
strict_equality = True

# Error reporting
show_error_codes = True
show_column_numbers = True
show_error_context = True
pretty = True

# Incremental mode
incremental = True
cache_dir = .mypy_cache

# Relaxed for JSON API parsing - external APIs inherently involve Any types
# These are disabled because the project works with external GitHub API responses
# that inherently involve Any types for dynamic JSON data
disallow_any_expr = False
disallow_any_explicit = False
disallow_any_decorated = False

# Allow selective ignoring of missing imports for external libraries
[mypy-pytest.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = True

[mypy-_pytest.*]
ignore_missing_imports = True

# Relaxed rules for test code (per user rules)
[mypy-tests.*]
disallow_any_decorated = False
disallow_any_expr = False
disallow_untyped_calls = False
warn_return_any = False
strict_equality = False
disable_error_code = union-attr,arg-type
